<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>GitHub Pages entry tests</title>
<style>body{font:16px system-ui;margin:24px}.pass{color:#287a48}.fail{color:#b73737}iframe{width:1024px;max-width:100%;height:700px}</style>
<body data-status="running"><h1>公開用入口の確認</h1><ol id="results"></ol>
<script type="module">
const results = document.querySelector('#results');
let failures = 0;
function report(label, ok) { const li = document.createElement('li'); li.className = ok ? 'pass' : 'fail'; li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${label}`; results.append(li); if (!ok) failures++; }
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(predicate) { for (let i=0;i<200;i++) { if (predicate()) return; await wait(50); } throw new Error('画面の読み込みが完了しませんでした'); }
let frame;
try {
  const rootURL = new URL('../index.html', location.href);
  const response = await fetch(rootURL);
  report('通常の静的ホストで公開用の入口を取得できる', response.ok);
  if (!response.ok) throw new Error('公開用 index.html がありません');
  frame = document.createElement('iframe'); frame.src = rootURL; document.body.append(frame);
  await until(() => frame.contentDocument?.querySelector('[data-action="create-fusuma"]'));
  const link = frame.contentDocument.querySelector('[data-action="create-fusuma"]');
  const expected = new URL('../Typing/creator/index.html', location.href);
  report('リポジトリのサブフォルダー内で作成画面へ移動できる', new URL(link.href).pathname === expected.pathname);
  link.click();
  await until(() => frame.contentWindow.__DEKIRU_CREATOR__);
  const doc = frame.contentDocument;
  report('公開用入口から保存付きの作成画面に到達する', Boolean(doc.querySelector('[data-action="save-project"]')));
  report('問題と読み込み済みの画像がある', doc.querySelectorAll('[data-role="question-card"]').length === 2 && frame.contentWindow.__DEKIRU_CREATOR__.manifest.assets.images.room.includes('/Typing/templates/fusuma/'));
  const bundleURL = new URL('../core/html-exporter.js', location.href);
  const {loadTemplateBundle, buildStandaloneHtml} = await import(bundleURL);
  const creator = frame.contentWindow.__DEKIRU_CREATOR__;
  const bundle = await loadTemplateBundle(creator.manifest);
  const html = buildStandaloneHtml({project:creator.store.getSnapshot(),bundle});
  report('公開パスから画像・音声を取得して配布用HTMLを生成できる', html.includes('data:image/') && html.includes('data:audio/') && html.includes('墾田永年私財法'));
} catch(error) { report(error.message, false); }
finally { frame?.remove(); }
document.body.dataset.status = failures ? 'failed' : 'passed';
document.title = `${failures ? 'FAIL' : 'PASS'} — GitHub Pages entry tests`;
</script></body></html>
