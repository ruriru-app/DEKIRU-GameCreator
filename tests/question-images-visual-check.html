<!doctype html><html lang="ja"><meta charset="utf-8"><title>問題画像の表示確認</title>
<style>html,body{margin:0;background:#faf7f0}iframe{width:100%;height:100vh;border:0}</style>
<iframe src="../Typing/creator/index.html" title="問題画像の編集例"></iframe>
<script type="module">
// A local synthetic diagram for visual acceptance, never uploaded.
const frame=document.querySelector('iframe');
const pause=()=>new Promise(requestAnimationFrame);
for(let i=0;i<300&&!frame.contentWindow.__DEKIRU_CREATOR__;i++)await pause();
const {store,preview}=frame.contentWindow.__DEKIRU_CREATOR__;
const canvas=document.createElement('canvas');canvas.width=480;canvas.height=300;
const ctx=canvas.getContext('2d');ctx.fillStyle='#faf7f0';ctx.fillRect(0,0,480,300);
ctx.fillStyle='#b59ad9';ctx.beginPath();ctx.moveTo(240,32);ctx.lineTo(405,262);ctx.lineTo(75,262);ctx.closePath();ctx.fill();
const first=store.getSnapshot().questions[0];
const doc=frame.contentDocument,win=frame.contentWindow;
function edit(selector,value){const input=doc.querySelector(selector);input.value=value;input.dispatchEvent(new win.Event('input',{bubbles:true}));}
edit('[data-role=set-title]','図形の名前クイズ');
edit('[data-role=question-card] [data-field=prompt]','この図形の名前は何ですか？');
edit('[data-role=question-card] [data-field=displayAnswer]','三角形');
edit('[data-role=question-card] [data-field=reading]','さんかくけい');
store.setQuestionImage(first.id,{dataUrl:canvas.toDataURL(),width:480,height:300,placement:'left',alt:'三つの辺で囲まれた図形'});
preview.selectQuestion(first.id);
</script></html>
