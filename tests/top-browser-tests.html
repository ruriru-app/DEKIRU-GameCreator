<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>DEKIRU Top Browser Tests</title>
  <style>body{font-family:system-ui,sans-serif;margin:20px;color:#4f4640}iframe{display:block;height:780px;border:1px solid #ccc}li{margin:5px 0}.pass{color:#287a48}.fail{color:#b73737}</style>
</head>
<body data-status="running">
  <h1>Top page acceptance</h1>
  <ol id="results"></ol>
  <script type="module">
    const results = document.querySelector('#results');
    let failures = 0;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    function report(name, passed, detail = '') {
      const item = document.createElement('li');
      item.className = passed ? 'pass' : 'fail';
      item.textContent = `${passed ? 'PASS' : 'FAIL'} — ${name}${detail ? `: ${detail}` : ''}`;
      results.append(item);
      if (!passed) failures += 1;
    }
    try {
      const response = await fetch('../app/index.html', { cache: 'no-store' });
      report('top page route returns HTML', response.ok, String(response.status));
      if (!response.ok) throw new Error(`top page returned ${response.status}`);

      const frame = document.createElement('iframe');
      frame.style.width = '390px';
      const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      frame.src = '../app/index.html?browserTest=top';
      document.body.append(frame);
      await loaded;
      await wait(50);
      let doc = frame.contentDocument;
      report('Typing and fusuma are selected',
        doc.querySelector('[data-game-type="typing"]')?.getAttribute('aria-pressed') === 'true'
        && doc.querySelector('[data-template="fusuma"]')?.getAttribute('aria-pressed') === 'true');
      report('390px top page has no horizontal overflow', doc.documentElement.scrollWidth <= doc.documentElement.clientWidth);

      doc.querySelector('[data-game-type="four-choice"]').click();
      report('Coming Soon keeps Typing selected and shows guidance',
        doc.querySelector('[data-game-type="typing"]').getAttribute('aria-pressed') === 'true'
        && !doc.querySelector('[data-role="toast"]').hidden);

      const navigated = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      doc.querySelector('[data-action="create-fusuma"]').click();
      await navigated;
      await wait(50);
      doc = frame.contentDocument;
      report('main template opens the Typing creator', Boolean(doc.querySelector('[data-role="creator-layout"]')));

      const returned = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      doc.querySelector('.back-link').click();
      await returned;
      report('creator back link returns to the top page', Boolean(frame.contentDocument.querySelector('[data-role="top-layout"]')));

      frame.style.width = '320px';
      await wait(40);
      report('320px top page has no horizontal overflow', frame.contentDocument.documentElement.scrollWidth <= frame.contentDocument.documentElement.clientWidth);
      frame.remove();
    } catch (error) {
      report('top page browser test completes', false, error.stack || error.message);
    }
    document.body.dataset.status = failures ? 'failed' : 'passed';
    document.title = failures ? `FAIL (${failures}) — Top Browser Tests` : 'PASS — Top Browser Tests';
  </script>
</body>
</html>
