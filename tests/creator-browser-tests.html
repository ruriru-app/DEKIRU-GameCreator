<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>DEKIRU Creator Browser Tests</title>
  <style>
    body { margin: 20px; font-family: system-ui, sans-serif; color: #4f4640; }
    iframe { display: block; height: 844px; border: 1px solid #ccc; }
    li { margin: 5px 0; }
    .pass { color: #287a48; }
    .fail { color: #b73737; }
  </style>
</head>
<body data-status="running">
  <h1>Creator acceptance</h1>
  <ol id="results"></ol>
  <script type="module">
    const results = document.querySelector('#results');
    let failures = 0;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    function report(name, passed, detail = '') {
      const item = document.createElement('li');
      item.className = passed ? 'pass' : 'fail';
      item.textContent = `${passed ? 'PASS' : 'FAIL'} — ${name}${detail ? `: ${detail}` : ''}`;
      results.append(item);
      if (!passed) failures += 1;
    }
    try {
      const frame = document.createElement('iframe');
      frame.style.width = '390px';
      const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      frame.src = '../Typing/creator/index.html?browserTest=creator';
      document.body.append(frame);
      await loaded;
      await wait(50);
      const doc = frame.contentDocument;
      report('creator layout loads', Boolean(doc.querySelector('[data-role="creator-layout"]')));
      report('390px viewport has no horizontal overflow', doc.documentElement.scrollWidth <= doc.documentElement.clientWidth,
        `${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`);
      report('390px layout stacks to one column', getComputedStyle(doc.querySelector('[data-role="creator-layout"]')).gridTemplateColumns.split(' ').length === 1);

      const paste = doc.querySelector('[data-role="paste-input"]');
      paste.value = '新しい問題\t新しい答え\tあたらしいこたえ\n不足行\t答え';
      doc.querySelector('[data-action="load-paste"]').click();
      report('replacement asks for confirmation', !doc.querySelector('[data-role="replace-confirm"]').hidden);
      doc.querySelector('[data-action="confirm-replace"]').click();
      await wait(0);
      report('paste keeps both editable rows', doc.querySelectorAll('[data-role="question-card"]').length === 2);
      report('partial row produces a row-numbered error', doc.querySelector('[data-role="import-errors"]').textContent.includes('2行目'));

      const firstReading = doc.querySelector('[data-role="question-card"] [data-field="reading"]');
      firstReading.value = 'へんこう';
      firstReading.dispatchEvent(new Event('input', { bubbles: true }));
      report('editing marks preview pending', !doc.querySelector('[data-role="preview-dirty"]').hidden);
      report('reading edit regenerates romaji hint', doc.querySelector('[data-role="romaji-hint"]').textContent === 'henkou');

      const invalidReading = [...doc.querySelectorAll('[data-field="reading"]')].find((element) => !element.value);
      const describedBy = invalidReading?.getAttribute('aria-describedby');
      report('invalid reading links to an accessible error', Boolean(describedBy && doc.getElementById(describedBy)));
      invalidReading.value = 'こたえ';
      invalidReading.dispatchEvent(new Event('input', { bubbles: true }));

      doc.querySelector('[data-role="question-card"] [data-action="duplicate"]').click();
      report('duplicate adds a question', doc.querySelectorAll('[data-role="question-card"]').length === 3);
      doc.querySelector('[data-role="question-card"] [data-action="move-down"]').click();
      doc.querySelector('[data-role="question-card"] [data-action="delete"]').click();
      report('move and delete controls remain usable', doc.querySelectorAll('[data-role="question-card"]').length === 2);
      report('primary editor controls are keyboard focusable', doc.querySelector('[data-action="restart-preview"]').tabIndex >= 0);

      doc.querySelector('[data-action="restart-preview"]').click();
      report('restart applies latest snapshot and clears pending state', doc.querySelector('[data-role="preview-dirty"]').hidden);

      const exportButton = doc.querySelector('[data-action="export-html"]');
      exportButton.click();
      report('export prevents a second click while assets are being bundled', exportButton.disabled);
      for (let attempt = 0; attempt < 200 && exportButton.disabled; attempt += 1) await wait(50);
      report('export completes without discarding editor state',
        !exportButton.disabled && frame.contentWindow.__DEKIRU_CREATOR__.store.getState().dirty === false);

      frame.style.width = '320px';
      await wait(60);
      report('320px viewport has no horizontal overflow', doc.documentElement.scrollWidth <= doc.documentElement.clientWidth,
        `${doc.documentElement.scrollWidth}/${doc.documentElement.clientWidth}`);
      frame.remove();
    } catch (error) {
      report('creator browser test completes', false, error.stack || error.message);
    }
    document.body.dataset.status = failures ? 'failed' : 'passed';
    document.title = failures ? `FAIL (${failures}) — Creator Browser Tests` : 'PASS — Creator Browser Tests';
  </script>
</body>
</html>
