<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>Standalone fullscreen tests</title>
<style>body{font-family:system-ui}iframe{border:0}.pass{color:green}.fail{color:crimson}</style>
<h1>Standalone edge-to-edge acceptance</h1><ol id="results"></ol>
<iframe title="書き出しゲーム" src="../dist/typing-fusuma-sample.html" width="1280" height="720"></iframe>
<script type="module">
const iframe = document.querySelector('iframe');
const withImages = new URLSearchParams(location.search).has('images');
if(withImages) iframe.src='../dist/typing-fusuma-images-test.html';
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
let failures = 0;
function report(name, passed, detail='') {
  const li=document.createElement('li'); li.className=passed?'pass':'fail';
  li.textContent=`${passed?'PASS':'FAIL'} — ${name} ${detail}`;
  document.querySelector('#results').append(li); if(!passed) failures++;
}
try {
  for(let i=0;i<100 && !iframe.contentDocument?.querySelector('#game-host')?.shadowRoot;i++) await wait(100);
  const doc=iframe.contentDocument, win=iframe.contentWindow;
  const shadow=doc.querySelector('#game-host').shadowRoot;
  if(!shadow) throw Error('export did not mount');
  const link=shadow.querySelector('link');
  if(!link.sheet) await new Promise(resolve=>link.addEventListener('load',resolve,{once:true}));
  for(const [width,height] of [[1280,720],[1024,768],[375,812]]) {
    iframe.width=width; iframe.height=height; await wait(100);
    const frame=shadow.querySelector('.game-frame'), rect=frame.getBoundingClientRect(), css=win.getComputedStyle(frame);
    report(`${width}×${height}: game covers the full browser viewport`,
      Math.abs(rect.left)<1 && Math.abs(rect.top)<1 && Math.abs(rect.width-width)<1 && Math.abs(rect.height-height)<1,
      `${rect.x},${rect.y},${rect.width},${rect.height}`);
    report(`${width}×${height}: no surrounding frame, rounded corners, shadow or page scrolling`,
      css.borderRadius==='0px' && css.boxShadow==='none'
      && doc.documentElement.scrollWidth<=width && doc.documentElement.scrollHeight<=height);
    report(`${width}×${height}: backgrounds crop without stretching`,win.getComputedStyle(shadow.querySelector('.room-image')).objectFit==='cover');
  }
  if(withImages) {
    iframe.width=1280;iframe.height=720;
    const q=role=>shadow.querySelector('[data-role="'+role+'"]');
    const until=async predicate=>{for(let i=0;i<300;i++){if(predicate())return;await wait(25);}throw Error('game transition timeout');};
    report('network-disabled export embeds the image project',doc.querySelector('meta[http-equiv="Content-Security-Policy"]').content.includes("connect-src 'none'")&&JSON.parse(doc.querySelector('#project-data').textContent).schemaVersion===2);
    q('start').click();
    report('export walks before the first image question',q('quiz').hidden&&q('stage').classList.contains('is-moving'));
    await until(()=>!q('quiz').hidden&&shadow.querySelector('.question-image')?.naturalWidth>0);
    report('export uses the embedded image in the selected position',shadow.querySelector('.question-image').src.startsWith('data:image/')&&q('quiz').dataset.imagePlacement==='left');
    const enter=value=>{q('input').value=value;q('input').dispatchEvent(new win.Event('input',{bubbles:true}));q('quiz').dispatchEvent(new win.Event('submit',{bubbles:true,cancelable:true}));};
    enter('a');await until(()=>q('stage').classList.contains('is-open'));await until(()=>q('stage').classList.contains('is-moving'));await until(()=>!q('quiz').hidden);
    report('export removes the image at the next question',q('question').textContent==='いを入力'&&!shadow.querySelector('.question-image')&&!q('quiz').classList.contains('is-shaking'));
    enter('i');await until(()=>!q('result-card').hidden);
    report('export reaches the clear scene with no network resources',!q('result-background').hidden&&win.performance.getEntriesByType('resource').every(item=>!/^https?:/.test(item.name)));
    q('replay').click();await until(()=>!q('quiz').hidden);
    report('export replay restores the first image question',q('question').textContent==='あを入力'&&!!shadow.querySelector('.question-image'));
    win.__DEKIRU_GAME__.destroy();
  }
} catch(error) { report('standalone loads',false,error.message); }
document.body.dataset.status=failures?'failed':'passed';
document.title=failures?`FAIL (${failures}) — Standalone`:'PASS — Standalone';
</script></html>
