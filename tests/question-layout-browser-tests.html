<!doctype html><html lang="ja"><meta charset="utf-8"><title>Question layout tests</title>
<style>body{font:16px system-ui}li{margin:4px}#hosts{display:flex;align-items:start;gap:30px}.host{flex:none;width:1280px;--game-radius:0px}.fail{color:#a00}</style>
<h1>問題画像の配置と静止プレビュー</h1><ol id="results"></ol><div id="hosts"><div class="host" id="game"></div><div class="host" id="still"></div></div>
<script type="module">
import * as renderer from '../Typing/templates/fusuma/renderer.js';
import {fusumaManifest as manifest} from '../Typing/templates/fusuma/manifest.js';
import {createTypingEngine} from '../Typing/core/typing-engine.js';
import {romajiToHiragana} from '../Typing/core/romaji-converter.js';
import {createFusumaEventController} from '../Typing/templates/fusuma/event-controller.js';
import {imageProject,pngImage} from './fixtures/question-images.mjs';
let fail=0,pass=0;const results=document.querySelector('#results');
const assert=(value,message)=>{if(!value)throw Error(message);};
async function check(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name;pass++;}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail';fail++;}results.append(li);}
const frame=()=>new Promise(requestAnimationFrame);
const ready=async host=>{const link=host.shadowRoot.querySelector('link');if(!link.sheet)await new Promise(r=>link.addEventListener('load',r,{once:true}));await frame();};
let now=0,id=0;const timers=new Map(),scheduler={setTimeout(callback,delay){timers.set(++id,{callback,time:now+delay});return id;},clearTimeout(id){timers.delete(id);}};
const advance=ms=>{const end=now+ms;for(;;){const next=[...timers].filter(([,t])=>t.time<=end).sort((a,b)=>a[1].time-b[1].time)[0];if(!next)break;now=next[1].time;timers.delete(next[0]);next[1].callback();}now=end;};
const audioCalls=[],audio={register(){},stopAll(){audioCalls.push('stop');},stopChannel(){},playLoop(){audioCalls.push('loop');},playEffect(){audioCalls.push('effect');}};
const gameHost=document.querySelector('#game'),stillHost=document.querySelector('#still');
let game,preview;
const role=(host,name)=>host.shadowRoot.querySelector('[data-role="'+name+'"]');
try{
 await check('静止プレビューが音・エンジン・タイマーなしで直接表示される',async()=>{
   assert(typeof renderer.mountFusumaQuestionPreview==='function','静止プレビュー未実装');
   const before=timers.size;
   preview=renderer.mountFusumaQuestionPreview({host:stillHost,project:imageProject(),questionId:'q1',manifest});
   await ready(stillHost);
   assert(timers.size===before&&audioCalls.length===0,'静止画からゲームを開始しない');
   assert(!role(stillHost,'quiz').hidden&&role(stillHost,'input').readOnly,'読み取り専用問題');
   assert(stillHost.shadowRoot.querySelector('.is-shaking')===null,'揺れない');
 });
 if(!preview)throw Error('以降は静止プレビュー実装後に実行');
 game=renderer.mountFusumaGame({host:gameHost,project:imageProject(),manifest,audioManager:audio,createEngine:createTypingEngine,convertRomaji:romajiToHiragana,createEventController:createFusumaEventController,scheduler});
 await ready(gameHost);
 for(const width of [320,600,601,1280])for(const placement of ['top','bottom','left','right']){
   await check(width+'px '+placement+' 本番と同じ配置・枠内に画像と入力',async()=>{
     const p=imageProject({...pngImage,placement});p.questions[0].prompt='写真の名前は何でしょう？';
     gameHost.style.width=stillHost.style.width=width+'px';
     game.restart(p);advance(manifest.timings.travelMs);preview.update({project:p,questionId:'q1'});await frame();
     const rect=(host,el)=>{const r=el.getBoundingClientRect(),f=host.getBoundingClientRect();return {x:r.x-f.x,y:r.y-f.y,width:r.width,height:r.height};};
     for(const selector of ['[data-role=question]','.question-image','[data-role=input]']){
       const a=gameHost.shadowRoot.querySelector(selector),b=stillHost.shadowRoot.querySelector(selector);assert(a&&b,'共通表示要素 '+selector);
       const ar=rect(gameHost,a),br=rect(stillHost,b);assert(['x','y','width','height'].every(k=>Math.abs(ar[k]-br[k])<=1),'矩形一致 '+selector);
     }
     const root=stillHost.shadowRoot,img=root.querySelector('.question-image'),panel=role(stillHost,'quiz').getBoundingClientRect(),ir=img.getBoundingClientRect(),input=role(stillHost,'input').getBoundingClientRect(),content=root.querySelector('.question-content').getBoundingClientRect();
     assert(ir.right<=panel.right+1&&ir.bottom<=panel.bottom+1&&ir.width>0&&ir.height>0,'画像が枠に収まる');
     assert(input.bottom<=panel.bottom+1&&panel.height<=width*9/16*.78+1,'入力欄と高さ上限');
     assert(getComputedStyle(img).objectFit==='contain','比率維持');
     const q=role(stillHost,'question').getBoundingClientRect();
     if(width<=600||['top','bottom'].includes(placement)){
       assert(Math.abs(ir.left+ir.width/2-(content.left+root.querySelector('.question-content').clientWidth/2))<2,'スクロールバーを除く内容の中央');
       assert(placement==='top'||placement==='left'?ir.bottom<=q.top+1:q.bottom<=ir.top+1,'上下順序');
     }else assert(placement==='left'?ir.right<=q.left+1:q.right<=ir.left+1,'左右順序');
   });
 }
 await check('長文・縦長画像でも解答欄が押し出されない',async()=>{
   const canvas=document.createElement('canvas');canvas.width=40;canvas.height=400;
   const ctx=canvas.getContext('2d');ctx.fillStyle='#b59ad9';ctx.fillRect(0,0,40,400);
   const p=imageProject({...pngImage,dataUrl:canvas.toDataURL(),width:40,height:400,placement:'left'});
   p.questions[0].prompt='これはとても長い問題文です。'.repeat(80);
   preview.update({project:p,questionId:'q1'});await frame();
   const panel=role(stillHost,'quiz').getBoundingClientRect(),input=role(stillHost,'input').getBoundingClientRect(),content=stillHost.shadowRoot.querySelector('.question-content');
   assert(input.bottom<=panel.bottom&&content.scrollHeight>content.clientHeight,'内容だけスクロール');
 });
 await check('画像を追加しても問題文の文字サイズと行間を縮めない',async()=>{
   for(const width of [601,800,1280]){
     stillHost.style.width=width+'px';const plain=imageProject();delete plain.questions[0].image;
     preview.update({project:plain,questionId:'q1'});await frame();
     const textStyle=getComputedStyle(role(stillHost,'question')),font=textStyle.fontSize,line=textStyle.lineHeight;
     preview.update({project:imageProject({...pngImage,placement:'left'}),questionId:'q1'});await frame();
     const imageStyle=getComputedStyle(role(stillHost,'question'));
     assert(imageStyle.fontSize===font&&imageStyle.lineHeight===line,width+'px: '+imageStyle.fontSize+'/'+imageStyle.lineHeight+' vs '+font+'/'+line);
   }
 });
 await check('左右画像の高さはゲーム幅600pxを境に切り替える',async()=>{
   const canvas=document.createElement('canvas');canvas.width=40;canvas.height=400;
   const p=imageProject({...pngImage,dataUrl:canvas.toDataURL(),width:40,height:400,placement:'left'});
   for(const width of [600,601,800]){
     stillHost.style.width=width+'px';preview.update({project:p,questionId:'q1'});await frame();
     const content=role(stillHost,'question-content'),img=stillHost.shadowRoot.querySelector('.question-image');
     await img.decode();
     const expected=Math.min(content.clientHeight*(width<=600?.42:.9),width<=600?240:340);
     assert(Math.abs(img.getBoundingClientRect().height-expected)<2,width+'px: '+img.getBoundingClientRect().height+' vs '+expected);
   }
 });
 await check('画像なしに戻すと前の画像を残さない・静止更新でフォーカスを奪わない',async()=>{
   const editor=document.createElement('input');document.body.prepend(editor);editor.focus();
   const p=imageProject();delete p.questions[0].image;preview.update({project:p,questionId:'q1'});await frame();
   assert(!stillHost.shadowRoot.querySelector('.question-image'),'旧画像除去');
   assert(document.activeElement===editor,'編集フォーカス維持');editor.remove();
 });
 await check('不正URLは通信せずエラー案内へ',async()=>{
   const p=imageProject({...pngImage,dataUrl:'https://example.invalid/tracker'});
   preview.update({project:p,questionId:'q1'});await frame();
   assert(!stillHost.shadowRoot.querySelector('img[src^="https://example.invalid"]'),'外部へ送信しない');
   assert(!role(stillHost,'image-error').hidden,'エラー案内');
 });
 await check('デコードできない画像は問題と入力を残して案内する',async()=>{
   const p=imageProject({...pngImage,dataUrl:'data:image/png;base64,aW52YWxpZA=='});
   preview.update({project:p,questionId:'q1'});
   for(let i=0;i<100&&role(stillHost,'image-error').hidden;i++)await frame();
   assert(!role(stillHost,'image-error').hidden,'デコード失敗の案内');
   assert(!role(stillHost,'quiz').hidden&&!role(stillHost,'input').disabled,'問題は残す');
   assert(role(stillHost,'question-picture').hidden,'壊れた画像を見せない');
 });
 await check('静止入力から送信しない・0問は案内',async()=>{
   const p=imageProject();p.questions=[];preview.update({project:p,questionId:null});
   assert(role(stillHost,'quiz').hidden,'0問の空案内');assert(role(stillHost,'status').textContent.includes('選'),'問題を選ぶ案内');
 });
}catch(e){await check(e.message,()=>{throw e;});}
finally{game?.destroy();preview?.destroy();}
document.body.dataset.status=fail?'fail':'pass';document.title=(fail?'FAIL':'PASS')+' Question layout '+pass+'/'+(pass+fail);
</script></html>
