name: Cloud isolation tests
on:
  push:
    branches: [feature/cloud-sharing]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  temporary-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned build tools without lifecycle scripts
        run: npm install --global pnpm@11.19.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild and verify committed authentication bundle
        run: |
          node tools/build-cloud-sdk.mjs
          git diff --exit-code -- vendor/supabase.js
      - name: Rebuild and verify committed shared-game endpoint
        run: |
          node tools/build-shared-function.mjs
          git diff --exit-code -- supabase/functions/shared-game/index.ts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - run: node --test tests/*.test.mjs
      - name: Start throwaway local services without logging local credentials
        id: database
        run: |
          if ! supabase start > /tmp/dekiru-local-start.log 2>&1; then
            echo "::error::Temporary local service startup failed."
            grep -Ei 'error|failed|invalid' /tmp/dekiru-local-start.log | head -n 15
            grep -A 90 -B 2 'SQLSTATE' /tmp/dekiru-local-start.log | head -n 100
            exit 1
          fi
      - run: supabase test db
      - if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: node --test tests/integration/cloud-db.test.mjs
      - if: always()
        run: supabase stop --no-backup
